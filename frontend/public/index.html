<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fc" />
    <script>
      (function () {
        try {
          var preference = localStorage.getItem("sastify-theme") || "system";
          var dark = preference === "dark" ||
            (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          var resolved = dark ? "dark" : "light";
          root.dataset.theme = resolved;
          root.dataset.themePreference = preference;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = resolved;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.content = dark ? "#0b1020" : "#f7f8fc";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <meta
      name="description"
      content="Sastify — a modern marketplace for thoughtfully curated products."
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { min-height: 100%; }
      body {
        margin: 0;
        background: #f7f8fc;
      }
      html[data-theme="dark"] body { background: #0b1020; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) body { background: #0b1020; }
      }
    </style>
    <title>Sastify — Modern Marketplace</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
